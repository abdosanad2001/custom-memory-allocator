name: C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out the repository code
    - uses: actions/checkout@v4

    # Install Valgrind for dynamic memory analysis
    - name: Install Valgrind
      run: sudo apt-get update && sudo apt-get install -y valgrind

    # Build the project executable using Makefile
    - name: Build project
      run: make

    # Run automated tests and enforce zero-leak policy
    - name: Run memory tests with Valgrind
      run: valgrind --leak-check=full --error-exitcode=1 ./test_runner
